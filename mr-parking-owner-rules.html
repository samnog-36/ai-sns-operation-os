<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr.Parking オーナー質問</title><style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:#f5f7fb;margin:0;color:#172334}main{max-width:610px;margin:0 auto;padding:22px 15px 70px}h1{font-size:20px;margin:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}header small{color:#66758a}.card{background:white;border:1px solid #dee5ee;border-radius:20px;padding:23px 19px;box-shadow:0 10px 35px #152b4a0a}.progress{height:7px;background:#edf1f5;border-radius:9px;overflow:hidden;margin:13px 0 28px}.progress div{height:100%;background:#2563eb;transition:width .2s}h2{font-size:22px;line-height:1.5;margin:0 0 18px}label.option{display:block;border:1px solid #e0e5ed;border-radius:12px;padding:15px;margin:10px 0;line-height:1.5;cursor:pointer}label.option:has(input:checked){background:#eaf2ff;border-color:#2563eb}input[type=radio]{margin-right:12px;accent-color:#2563eb}textarea{width:100%;border:1px solid #d2dce7;border-radius:10px;padding:12px;font:inherit;margin:8px 0;min-height:80px;resize:vertical}.nav{display:flex;gap:10px;margin-top:20px}button{border:1px solid #cfdaea;background:white;border-radius:12px;padding:15px 20px;font-size:16px;font-weight:700;cursor:pointer}button.next{flex:1;background:#2563eb;color:white;border:0}button.line{background:#06c755;color:white;border:0;width:100%;padding:20px;margin-top:15px;font-size:19px}.muted{color:#64748b;font-size:13px;line-height:1.7}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;background:#f8fafc;border-radius:12px;padding:12px}#finish{display:none}
</style></head><body><main><header><div><h1>MR.PARKING</h1><small>オーナー運用ルール確認</small></div><small>質問 8問</small></header><div class="card"><div id="page"><div class="muted" id="count"></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div id="choices"></div><p class="muted">補足・例外があればご入力ください（任意）</p><textarea id="note" placeholder="補足があれば入力"></textarea><div class="nav"><button id="back" type="button">戻る</button><button class="next" id="next" type="button">次へ</button></div></div><div id="finish"><h2>回答完了です！</h2><p>下の「回答を送信」を押すだけで完了です。</p><pre id="results"></pre><button type="button" class="line" id="line">回答を送信</button><button type="button" id="copy" style="width:100%;margin-top:10px">回答をコピー</button><button type="button" id="edit" style="margin-top:10px">回答を修正</button><p class="muted">送信内容は管理者にメールで届きます。</p></div></div><p class="muted">送信すると管理者宛に回答が送られます。予約や車両の指示は変更されません。</p></main><script>
const qs=[["本店の空き9台分は、常に守る最低ラインですか？","常時9台分以上の空きを守る","9台は目標。予約・スタッフ状況によって減ってもよい","時間帯や店舗ごとに下限を設定する","その他"],["本店に空きが足りず、モータープールの列の一部だけ回収する場合、残りの車は？","元の縦列に残す","同じモータープール内で効率のよい位置に再配置する","原則は元の列、必要時のみ再配置","管理者が決める"],["お客様が予定より早く戻り、対象車がモータープールの奥にある場合は？","対象車だけ優先して回収する","列全体をまとめて回収する","本店の空き・人数から効率のよい方法を選ぶ","管理者が個別に指示する"],["出庫30分前の本店回収と、新規入庫対応が両立できないときは？","管理者へ即時通知し人員・作業を調整する","30分前の回収を優先する","入庫を優先し、遅延リスクを報告する","その他"],["スタッフ待機時、当日中に1時間あたり入庫10台超の時間帯があれば、前倒し作業はしませんか？","当日残りのどこかで10台超なら原則前倒ししない","混雑が近づいた時間帯だけ制限する","人数と作業時間で判断し10台は目安とする","その他"],["国内線のスーパーカー等で7番プールに駐車できない場合は？","管理者の判断を仰ぐ","指定代替プールへ自動配置","本店で待機させ管理者が判断","その他"],["寸法上は駐車できても実際には停めにくい車と枠の組み合わせは？","不明なら割当を保留して管理者に確認する","車格で仮判定して現場で最終確認する","問題のあった組み合わせを次回から自動除外する","その他"],["同じ列の複数車両を続けて本店へ回収するとき、スタッフ人数は？","原則1人で順次往復する","人数がそろえば複数人で連続回収する","車両台数・距離・時間帯で管理者が決める","その他"]];let i=0;let answers={};try{answers=JSON.parse(localStorage.getItem('mrparking-owner-rules-final-v2')||'{}')}catch(e){}
const el=id=>document.getElementById(id);function save(){try{localStorage.setItem('mrparking-owner-rules-final-v2',JSON.stringify(answers))}catch(e){}}function render(){if(i===qs.length){finish();return;}el('page').style.display='block';el('finish').style.display='none';el('count').textContent='質問 '+(i+1)+' / '+qs.length;el('bar').style.width=((i+1)/qs.length*100)+'%';el('question').textContent=qs[i][0];el('choices').replaceChildren();for(let j=1;j<qs[i].length;j++){const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='ans';input.value=qs[i][j];input.checked=answers[i]?.a===input.value;input.addEventListener('change',()=>{answers[i]??={};answers[i].a=input.value;save()});label.append(input,document.createTextNode(qs[i][j]));el('choices').append(label)}el('note').value=answers[i]?.note||'';el('back').disabled=i===0;el('next').textContent=i===qs.length-1?'回答を確認':'次へ'}el('note').addEventListener('input',e=>{answers[i]??={};answers[i].note=e.target.value;save()});el('back').onclick=()=>{i--;render()};el('next').onclick=()=>{if(!answers[i]?.a&&!answers[i]?.note){alert('回答を選択してください');return;}i++;render()};function output(){return 'Mr.Parking オーナー追加ルール回答\n'+qs.map((q,n)=>'\nQ'+(n+1)+' '+q[0]+'\n回答：'+(answers[n]?.a||'未回答')+'\n補足：'+(answers[n]?.note||'なし')).join('\n')}function finish(){el('page').style.display='none';el('finish').style.display='block';el('results').textContent=output()}el('line').onclick=()=>{const form=document.createElement('form');form.method='POST';form.action='https://formsubmit.co/samkojinmail@gmail.com';const inp=document.createElement('input');inp.type='hidden';inp.name='回答内容';inp.value=output();form.appendChild(inp);document.body.appendChild(form);form.submit()};el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(output());alert('コピーしました。LINEに貼り付けて送信してください')}catch(e){alert('コピーできませんでした。画面の回答を長押ししてコピーしてください')}};el('edit').onclick=()=>{i=0;render()};render();
</script></body></html>
